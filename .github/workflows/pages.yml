name: Pages

# Publishes the interactive results site (web/) to GitHub Pages. It contains only the
# disclosure-controlled release bundle (release/public when present, otherwise the synthetic one).
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "release/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Build (copies only the release bundle)
        run: npm run build
      - name: Guard - the site holds nothing but the app and the release bundle
        run: |
          find dist -type f | sort
          if find dist -type f ! -path 'dist/assets/*' ! -name index.html ! -path 'dist/data/bundle.json' | grep -q .; then
            echo "Unexpected file in the site"; exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
