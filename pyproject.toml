[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vamengoc"
version = "0.1.0"
description = "Reproducible pharmacovigilance and lot-quality analytics for the VA-MENGOC-BC vaccine (Finlay Vaccine Institute, DICEI)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Richard Alejandro Matos Arderí" },
    { name = "Abel Ponce González" },
]
keywords = ["pharmacovigilance", "vaccine safety", "AEFI", "disproportionality", "statistical process control", "VA-MENGOC-BC"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scipy>=1.13",
    "statsmodels>=0.14.2",
    "scikit-learn>=1.5",
    "openpyxl>=3.1.3",
    "pyarrow>=16",
    "pydantic>=2.7",
    "pyyaml>=6.0.1",
    "rapidfuzz>=3.9",
    "typer>=0.12",
    "rich>=13.7",
    "matplotlib>=3.9",
    "cryptography>=43",
    "jinja2>=3.1.4",
    "lightgbm>=4.5",
    "ruptures>=1.1.9",
    "xlrd>=2.0.1",
    "python-calamine>=0.3",
]

[project.optional-dependencies]
app = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
vamengoc = "vamengoc.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5",
    "pytest-xdist>=3.6",
    "hypothesis>=6.108",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "httpx>=0.27",
    "pre-commit>=3.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vamengoc"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "C4", "PT", "RUF", "PL", "NPY", "PD", "S", "DTZ", "PTH", "ERA"]
ignore = [
    "PLR0913",  # scientific functions legitimately take many parameters
    "PLR0917",
    "PLR2004",  # magic numbers are domain constants documented in configs
    "PLC0415",  # heavy/optional dependencies are imported lazily on purpose
    "PD010",    # unstack is the clearest idiom for quantile tables
    "S101",     # assert is used for internal invariants
    "RUF001", "RUF002", "RUF003",  # Spanish text contains ambiguous-looking unicode on purpose
    "N803", "N806",  # statistical notation (N, E, X) is clearer than snake_case here
    "PLR0915", "PLR0912", "PLR0911",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "D", "N802", "PT018", "DTZ001", "PTH116", "E501"]
"src/vamengoc/synth/**" = ["DTZ001", "S311"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
files = ["src/vamengoc"]

[[tool.mypy.overrides]]
module = ["vamengoc.api.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
    "slow: long-running end-to-end or statistical-calibration tests",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:statsmodels.*",
    "ignore::DeprecationWarning:patsy.*",
    "ignore::DeprecationWarning:openpyxl.*",
    "ignore::UserWarning:openpyxl.*",
]

[tool.coverage.run]
branch = true
source = ["vamengoc"]
omit = ["src/vamengoc/api/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
